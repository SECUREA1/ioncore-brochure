<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ioncore Cloud Chat</title>
  <link rel="icon" href="../battery.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="color-scheme" content="dark light" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
      :root {
        --bg: #030712;
        --panel: rgba(9, 16, 29, 0.92);
        --muted: #8aa0c7;
        --fg: #f5f8ff;
        --accent: #6aff3b;
        --accent-2: #3cbf2a;
        --danger: #ff5d6e;
        --shadow: 0 18px 48px rgba(9, 16, 29, 0.42);
        --radius: 18px;
        --lining: rgba(106, 255, 59, 0.22);
        --caption-font: 'Inter', 'Montserrat', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        --caption-color: #f5f8ff;
        --caption-bg: rgba(3, 7, 18, 0.72);
      }
      :root[data-theme='light']{
        --bg:#f8fafc;
        --panel:#ffffff;
        --fg:#0b1220;
        --muted:#4b5568;
        --accent:#38a626;
        --accent-2:#0f7a23;
        --shadow: 0 18px 48px rgba(15, 122, 35, 0.18);
        --lining: rgba(56, 166, 38, 0.32);
        --caption-color:#0b1220;
        --caption-bg: rgba(255,255,255,0.82);
      }
    * { box-sizing: border-box; }
      html, body { height: 100%; width:100%; overflow-x:hidden; }
      body {
        margin:0;
        background:
          radial-gradient(1200px 1200px at -10% -20%, color-mix(in oklab, var(--accent), transparent 80%), transparent 60%),
          radial-gradient(900px 900px at 110% 10%, color-mix(in oklab, var(--accent-2), transparent 80%), transparent 70%),
          var(--bg);
        color:var(--fg);
        font: 15px/1.5 'Montserrat', 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      .wrap {
        display:flex;
        flex-direction:column;
        min-height:100vh;
        width:100%;
        max-width:100%;
        margin:0 auto;
      }

    header { display:flex; align-items:center; gap:18px; padding:18px clamp(16px,4vw,32px); position: sticky; top: 0; z-index: 5; flex-wrap:wrap; backdrop-filter: blur(18px); background: linear-gradient(120deg, color-mix(in oklab, var(--panel), transparent 18%), color-mix(in oklab, var(--panel), transparent 4%)); border-bottom: 1px solid color-mix(in oklab, var(--lining), transparent 60%); box-shadow: 0 12px 30px rgba(3,7,18,0.22); }
    .brand { display:flex; align-items:center; gap:14px; min-width:240px; }
    .brand-copy { display:flex; flex-direction:column; }
    .brand .logo { width:48px; height:48px; border-radius:16px; display:grid; place-items:center; background: color-mix(in oklab, var(--accent), transparent 70%); box-shadow: var(--shadow); border:1px solid var(--lining); }
    .brand .logo img { width:28px; height:28px; display:block; }
    .brand h1 { font-weight: 700; letter-spacing:.4px; font-size: 20px; margin:4px 0 0; }
    .brand .eyebrow { display:block; font-size:11px; letter-spacing:.28em; text-transform:uppercase; color: var(--accent); margin-bottom:2px; }
    .status { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .status .chip { flex:1 1 auto; justify-content:center; min-width:120px; }
    header .chip { padding:6px 12px; }
    header .status.top { margin-left:auto; justify-content:flex-end; }
    footer {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
      padding:18px clamp(16px,4vw,32px);
      position: sticky;
      bottom:0;
      z-index:5;
      backdrop-filter: blur(16px);
      background: linear-gradient(120deg, color-mix(in oklab, var(--panel), transparent 12%), color-mix(in oklab, var(--panel), transparent 2%));
      border-top: 1px solid color-mix(in oklab, var(--lining), transparent 60%);
      box-shadow: 0 -10px 28px rgba(3,7,18,0.2);
    }
    footer .status.bottom { justify-content:space-around; width:100%; }
    footer .status.bottom .chip { flex:1 1 25%; justify-content:center; }
    footer .legal { font-size:12px; color:var(--muted); text-align:center; }
    .chip { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid color-mix(in oklab, var(--lining), transparent 30%);
            border-radius:14px; background: color-mix(in oklab, var(--panel), transparent 12%); box-shadow: var(--shadow); color: var(--fg); font-weight:600; letter-spacing:0.01em; }
    #live-chip, #theme-toggle, #mode-toggle { cursor:pointer; }
    #cc-settings, #theme-toggle {
      width:38px;
      height:38px;
      padding:0;
      justify-content:center;
      border-radius:12px;
    }
    #mode-toggle {
      min-width:150px;
      height:38px;
      padding:0 18px;
      justify-content:center;
      border-radius:12px;
    }
    #cc-settings {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border:0;
      color:#041306;
    }
    .dot { width:10px; height:10px; border-radius:999px; background:var(--muted); }
    .dot.ok { background: var(--accent); }
    .dot.local { background: #ffb020; }
    .dot.off { background: var(--danger); }
    .usr { font-weight:600; color: var(--fg); }

    main { display:flex; flex-direction:column; gap:0; padding:0; flex:1; }

    .feed { list-style:none; margin:0 clamp(16px,4vw,32px) 24px; padding:24px; border-radius: var(--radius); background: color-mix(in oklab, var(--panel), transparent 8%); overflow-y: auto; flex:1; box-shadow: var(--shadow); border:1px solid color-mix(in oklab, var(--lining), transparent 45%); }
    .msg { display:flex; gap:10px; margin-bottom:14px; width:100%; }
    .msg.mine { flex-direction: row-reverse; }
    .avatar { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-weight:700; background: color-mix(in oklab, var(--accent), transparent 75%); color:#ccebd0; border:1px solid color-mix(in oklab, var(--lining), transparent 40%); }
    .msg.mine .avatar { background: color-mix(in oklab, var(--accent), black 60%); color: var(--accent); }

    .bubble { flex:1; position:relative; padding:16px 18px 14px; border-radius: 14px; background: color-mix(in oklab, var(--panel), transparent 6%); border:1px solid color-mix(in oklab, var(--lining), transparent 40%); box-shadow: var(--shadow); }
    .msg.mine .bubble { background: color-mix(in oklab, var(--accent), var(--bg) 70%); border-color: color-mix(in oklab, var(--lining), transparent 10%); }

    .meta { display:flex; align-items:center; gap:10px; margin-bottom:4px; font-size:12px; color: var(--muted); }
    .who { font-weight:700; color: var(--fg); }

    .msg.mine .meta { justify-content:flex-end; }
    .msg.mine .msg-text { text-align:right; }

    .msg-text { white-space: pre-wrap; word-wrap: break-word; }

    video::cue {
      font-family: var(--caption-font);
      color: var(--caption-color);
      background-color: var(--caption-bg);
    }

    .cc-panel {
      position:absolute;
      top:70px;
      right:24px;
      background: color-mix(in oklab, var(--panel), transparent 6%);
      border:1px solid color-mix(in oklab, var(--lining), transparent 40%);
      border-radius:16px;
      padding:14px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      gap:10px;
      z-index:10;
    }

    .cc-panel label { display:flex; flex-direction:column; gap:4px; font-size:14px; }
    .cc-panel button { align-self:flex-end; }

    .actions { margin-top:6px; display:flex; gap:10px; }
    .like-btn { background:transparent; border:0; cursor:pointer; color:var(--fg); }
    .comments { margin-top:6px; }
    .comments-list { margin-bottom:6px; }
    .comment { font-size:13px; margin-bottom:4px; }
    .comment-form input { width:100%; padding:6px 10px; border-radius:10px; border:1px solid color-mix(in oklab, var(--lining), transparent 40%); background: color-mix(in oklab, var(--panel), transparent 12%); color: var(--fg); }

    .msg.collapsed .msg-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-height: 3.3em; }
    .min-btn { position:absolute; top:8px; right:8px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; padding:2px 6px; border-radius:8px; }
    .min-btn:hover { color:var(--fg); background: rgba(255,255,255,.06); }

    .system { text-align:center; color: var(--accent); font-size: 13px; margin: 12px 0; letter-spacing:0.08em; text-transform:uppercase; }

    .composer { display:grid; grid-template-columns: minmax(0,1fr) auto auto auto; gap:12px; margin:16px clamp(16px,4vw,32px) 24px; }
    .input { display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius: 16px; background: color-mix(in oklab, var(--panel), transparent 10%); border:1px solid color-mix(in oklab, var(--lining), transparent 40%); box-shadow: var(--shadow); }
    .input input { flex:1; font: inherit; color: var(--fg); background: transparent; border:0; outline:0; }
    .input input::placeholder { color: color-mix(in oklab, var(--muted), transparent 10%); }
    .send { padding:10px 14px; border-radius:14px; border:0; font-weight:700; cursor:pointer; color:#041306; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: var(--shadow); }
    .send:disabled { opacity:.6; cursor:not-allowed; }

    /* Auth screen */
    .auth { position: fixed; inset:0; display:grid; place-items:center; background: linear-gradient(180deg, rgba(0,0,0,.65), rgba(0,0,0,.65)); backdrop-filter: blur(4px); }
    .card { width:min(520px, 92vw); padding:32px; border-radius: 22px; background: color-mix(in oklab, var(--panel), transparent 4%); border: 1px solid color-mix(in oklab, var(--lining), transparent 40%); box-shadow: var(--shadow); }
    .card h2 { margin:0 0 12px; font-size: 24px; font-weight: 700; }
    .card p { margin: 0 0 16px; color: var(--muted); }
    .fields { display:grid; gap:10px; }
    .fields input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid color-mix(in oklab, var(--lining), transparent 40%); background: color-mix(in oklab, var(--panel), transparent 12%); color: var(--fg); font: inherit; }
    .actions { display:flex; gap:10px; margin-top:12px; }
    .btn { padding:12px 16px; border-radius:14px; border:0; font-weight:700; cursor:pointer; }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#041306; box-shadow: var(--shadow); }
    .btn.ghost { background: color-mix(in oklab, var(--panel), transparent 14%); color: var(--fg); border:1px solid color-mix(in oklab, var(--lining), transparent 30%); }

    .muted-link { color: var(--muted); text-decoration: underline; cursor: pointer; }

    a { color: var(--accent); }

    .users-panel { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); padding:18px; border-radius:20px; background: color-mix(in oklab, var(--panel), transparent 8%); border:1px solid color-mix(in oklab, var(--lining), transparent 40%); box-shadow:var(--shadow); max-width:220px; max-height:60vh; overflow-y:auto; }
    .users-panel h3 { margin:0 0 8px; font-size:14px; }
    .users-panel ul { list-style:none; margin:0; padding:0; }
    .users-panel li { padding:6px 0; border-bottom:1px solid color-mix(in oklab, var(--lining), transparent 50%); }
    .users-panel li:last-child { border-bottom:0; }
    .users-panel li.mic-user { color:var(--accent); }

    .live-btn {
      margin-left:6px;
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:6px 10px;
      border:0;
      border-radius:10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      cursor:pointer;
      color:#041306;
      font-size:12px;
      font-weight:600;
      box-shadow: var(--shadow);
    }
    .live-dot {
      display:inline-block;
      width:8px;
      height:8px;
      margin-right:4px;
      border-radius:50%;
      background:var(--danger);
      animation: live-pulse 1s infinite;
    }
    @keyframes live-pulse {
      0%, 100% { opacity:1; }
      50% { opacity:0.2; }
    }

    #broadcast-btn.live {
      animation: live-pulse 1s infinite;
      border-color: var(--danger);
      color: var(--danger);
    }

    #streams { display:flex; flex-wrap:wrap; gap:16px; padding:16px clamp(16px,4vw,32px); }
    .stream { position:relative; width:180px; border:1px solid color-mix(in oklab, var(--lining), transparent 40%); border-radius:16px; padding:14px; background: color-mix(in oklab, var(--panel), transparent 10%); cursor:pointer; box-shadow: var(--shadow); transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .stream:hover { transform: translateY(-4px); box-shadow: 0 24px 54px rgba(3,7,18,0.34); }
    .stream.open { width:320px; }
    .stream .title { font-weight:700; margin-bottom:10px; color: var(--fg); display:flex; justify-content:space-between; align-items:center; }
    .stream .title .listener-count { color: var(--accent); font-variant-numeric: tabular-nums; }
    .stream .thumb { width:100%; border-radius:12px; box-shadow: var(--shadow); }
    .stream.open .thumb { display:none; }
    .stream .video { display:none; }
    .stream.open .video { display:block; }
    .stream .video video { width:100%; border-radius:12px; }
    .stream-feed { list-style:none; margin:12px 0 0; padding:0; max-height:140px; overflow-y:auto; display:none; }
    .stream.open .stream-feed { display:block; }
    .stream-composer { display:none; margin-top:10px; gap:6px; }
    .stream.open .stream-composer { display:flex; }
    .stream-composer input { flex:1; padding:8px 10px; border-radius:10px; border:1px solid color-mix(in oklab, var(--lining), transparent 40%); background: color-mix(in oklab, var(--panel), transparent 14%); color: var(--fg); }
    .request-btn,
    .request-mic-btn {
      margin-top:6px;
      width:100%;
      padding:10px 12px;
      border:1px solid color-mix(in oklab, var(--lining), transparent 40%);
      border-radius:12px;
      background: color-mix(in oklab, var(--panel), transparent 14%);
      color:var(--fg);
      cursor:pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .request-btn:hover,
    .request-mic-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 32px rgba(3,7,18,0.28); }
    .request-btn:disabled,
    .request-mic-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
    .tune-btn {
      margin-top:6px;
      width:100%;
      padding:10px 12px;
      border:0;
      border-radius:12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color:#041306;
      cursor:pointer;
      font-weight:700;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .tune-btn:hover { transform: translateY(-2px); box-shadow: 0 24px 48px rgba(6,20,38,0.34); }
    .tune-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
    #video-container { display:flex; flex-wrap:wrap; gap:16px; padding:16px clamp(16px,4vw,32px); }
    #video-container video { max-width:260px; border-radius:16px; border:1px solid color-mix(in oklab, var(--lining), transparent 40%); box-shadow: var(--shadow); }

    /* Fullscreen broadcast layout */
    body.broadcast-mode header,
    body.broadcast-mode .composer,
    body.broadcast-mode footer {
      display: none;
    }
    body.broadcast-mode #video-container {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0;
      background: #000;
      flex-wrap: nowrap;
    }
    body.broadcast-mode #video-container video {
      flex: 1;
      width: 100%;
      height: 100%;
      max-width: none;
      border: 0;
      border-radius: 0;
      object-fit: contain;
    }
    body.broadcast-mode #feed {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 33vh;
      margin: 0;
      border-radius: 0;
      background: transparent;
      z-index: 1001;
    }

    #thumb-chooser {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in oklab, var(--panel), transparent 20%);
      backdrop-filter: blur(12px);
      z-index: 1002;
    }
    #thumb-chooser .thumb-options {
      display: flex;
      gap: 20px;
    }
    #thumb-chooser button {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--shadow);
      color:#041306;
    }

    /* ✅ make hidden actually hide, even with .auth display rules */
    [hidden] { display: none !important; }
    .auth.is-hidden { display: none !important; }
    @media (max-width: 600px) {
      header { flex-wrap: wrap; padding:14px; gap:10px; }
      footer { padding:14px; gap:10px; }
      .status { margin-left:0; flex-wrap:wrap; width:100%; gap:8px; justify-content:center; }
      .status .chip { flex:1 1 48%; justify-content:center; min-width:0; }
      .feed { margin:0 12px 18px; padding:16px; }
      .composer { margin:12px 12px 18px; grid-template-columns: minmax(0,1fr) auto auto; }
      .composer #cmd-list { display:none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true"><img src="../battery.svg" alt="" width="28" height="28"></div>
        <div class="brand-copy">
          <span class="eyebrow">Ioncore Energy</span>
          <h1>Ioncore Cloud Chat</h1>
        </div>
      </div>
      <div class="status top">
        <span class="chip" id="conn-chip" title="Ioncore Cloud connection status">
          <span class="dot off" id="conn-dot"></span>
          <span id="conn-label">Awaiting Ioncore Cloud</span>
        </span>
        <button class="chip" id="stream-code-btn" title="Copy Ioncore stream code">🔑 Stream Code</button>
        <button class="chip" id="camera-flip-btn" title="Switch camera">🔁 Flip</button>
        <button class="chip" id="fullscreen-btn" title="Toggle fullscreen">⛶ Fullscreen</button>
        <button id="mode-toggle" class="chip" title="Switch between Ioncore Cloud or local relay"></button>
        <button id="cc-settings" class="chip" title="Caption settings">CC</button>
      </div>
    </header>
    <div id="cc-panel" class="cc-panel" hidden>
      <label>Font
        <select id="cc-font">
          <option value="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">System</option>
          <option value="Arial">Arial</option>
          <option value="Georgia">Georgia</option>
          <option value="Courier New">Courier New</option>
        </select>
      </label>
      <label>Color
        <input type="color" id="cc-color" value="#ffffff" />
      </label>
      <button id="cc-apply" type="button" class="btn ghost">Apply</button>
    </div>

      <main>
        <div id="streams" class="streams"></div>
        <form id="composer" class="composer" autocomplete="off">
          <label class="input" for="text">
            <input id="text" name="text" placeholder="Share a mission update… (try /wave, /me dance or /clear)" />
          </label>
        <input id="file" type="file" hidden />
        <button class="send" id="attach" type="button" title="Attach file" aria-label="Attach file">📎</button>
        <button class="send" id="send" type="submit" aria-label="Send message">🚀</button>
        <button class="send" id="cmd-list" type="button" title="Show Ioncore command palette" aria-label="Show commands">📃</button>
      </form>
        <div id="video-container" hidden></div>
        <ul id="feed" class="feed" aria-live="polite" aria-busy="false"></ul>
      </main>

    <footer>
      <div class="status bottom">
        <button class="chip" id="broadcast-btn" title="Launch Ioncore live feed">🎥 Live</button>
        <span class="chip" id="live-chip" title="Participants on deck">
          <span id="live-count">0</span> connected
        </span>
        <button id="theme-toggle" class="chip" title="Toggle dark or light mode"></button>
        <span class="chip" id="user-chip" title="Ioncore ID" style="display:none">
          <span class="usr" id="user-name"></span>
          <button id="logout-btn" class="btn ghost" style="padding:6px 10px" type="button">Logout</button>
        </span>
      </div>
      <div class="legal">© <span id="year"></span> Ioncore Energy • Powered by the Ioncore Cloud.</div>
    </footer>
  </div>

  <div id="user-list" class="users-panel" hidden>
    <h3>Online now</h3>
    <ul id="users"></ul>
  </div>

  <!-- Auth overlay -->
  <section id="auth" class="auth" hidden>
    <div class="card">
      <h2>Welcome to Ioncore Cloud Chat</h2>
      <p>Claim a callsign to enter the command lounge.</p>
      <div class="fields">
        <input id="username" placeholder="Username (e.g., aurora.ops)" maxlength="24" />
      </div>
      <div class="actions">
        <button class="btn primary" id="enter" type="button">Join Mission</button>
        <button class="btn ghost" id="skip" type="button">Enter as Guest</button>
      </div>
      <p style="margin-top:10px">Optional Ioncore Cloud socket: <span class="muted-link" id="ws-edit">configure</span></p>
      <div id="ws-config" class="fields" style="display:none; margin-top:8px">
        <input id="ws-url" placeholder="wss://chaines-chat-ws.onrender.com/ws (optional)" />
        <button class="btn ghost" id="save-ws" type="button">Save Socket URL</button>
      </div>
    </div>
  </section>

  <!-- Thumbnail chooser overlay -->
  <div id="thumb-chooser" hidden>
    <div class="thumb-options">
      <button id="thumb-upload" title="Upload image">🖼️</button>
      <button id="thumb-camera" title="Take photo">📷</button>
      <button id="thumb-skip" title="No photo">🚫</button>
    </div>
  </div>

  <script>
  ;(() => {
    const el = (q, parent=document) => parent.querySelector(q);
    const feed = el('#feed');
    const form = el('#composer');
    const input = el('#text');
    const attachBtn = el('#attach');
    const fileInput = el('#file');
    const sendBtn = el('#send');
    const cmdListBtn = el('#cmd-list');
    const defaultPlaceholder = input.placeholder;

      function chooseThumbnail(){
        return new Promise(resolve => {
          thumbChooser.hidden = false;

          function cleanup(){
            thumbChooser.hidden = true;
            thumbUpload.removeEventListener('click', onUpload);
            thumbCamera.removeEventListener('click', onCamera);
            thumbSkip.removeEventListener('click', onSkip);
          }

          function pick(capture){
            thumbChooser.hidden = true;
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = 'image/*';
            if(capture) inp.capture = 'environment';
            inp.onchange = () => {
              const file = inp.files[0];
              cleanup();
              if(!file){ resolve(null); return; }
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.readAsDataURL(file);
            };
            inp.click();
          }

          function onUpload(){ pick(false); }
          function onCamera(){ pick(true); }
          function onSkip(){ cleanup(); resolve(null); }

          thumbUpload.addEventListener('click', onUpload, { once: true });
          thumbCamera.addEventListener('click', onCamera, { once: true });
          thumbSkip.addEventListener('click', onSkip, { once: true });
        });

    function defaultWS(){
      const host = (location.hostname || '').toLowerCase();
      const isLocal = !host || /localhost|127\\.0\\.0\\.1/.test(host);
      if(isLocal){
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        return proto + (location.host || 'localhost:10000') + '/ws';
      }
      const remoteHost = 'chaines-chat-ws.onrender.com';
      if(host === remoteHost){
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        return proto + location.host + '/ws';
      }
      return 'wss://' + remoteHost + '/ws';
    }

    function setStatus(mode){
      onlineMode = mode;
      connDot.classList.remove('ok','local','off');
      if(mode === 'cloud'){ connDot.classList.add('ok'); connLabel.textContent = 'Connected • Ioncore Cloud'; }
      else if(mode === 'local'){ connDot.classList.add('local'); connLabel.textContent = 'Connected • Local Relay'; updateUsers([]); }
      else { connDot.classList.add('off'); connLabel.textContent = 'Ioncore Cloud offline'; updateUsers([]); }
      modeToggle.textContent = mode === 'cloud' ? 'Use Local Relay' : 'Return to Cloud';
    }

    function connectWS(forceDefault=false){
      if(!('WebSocket' in window)) { setStatus('off'); return; }
      const desired = forceDefault ? defaultWS() : (store.wsURL || defaultWS());
      const target = desired || defaultWS();
      if(forceDefault && target) store.wsURL = target;
      if(socket && socket.readyState <= 1){
        try { socket.close(); } catch {}
      }
      let attemptedFallback = forceDefault || !target || target === defaultWS();
      let url = target;
      try {
        socket = new WebSocket(url);
      } catch (err) {
        if(!attemptedFallback){
          attemptedFallback = true;
          const fallback = defaultWS();
          if(fallback && fallback !== url){
            store.wsURL = fallback;
            connectWS(true);
            return;
          }
        }
        setStatus(bc ? 'local' : 'off');
        systemNote('Ioncore Cloud unavailable. Staying on local relay.');
        return;
      }

      const handleFailure = () => {
        if (manualDisconnect) {
          manualDisconnect = false;
          return;
        }
        if(!attemptedFallback){
          attemptedFallback = true;
          const fallback = defaultWS();
          if(fallback && fallback !== url){
            store.wsURL = fallback;
            connectWS(true);
            return;
          }
        }
        setStatus(bc ? 'local' : 'off');
        systemNote('Ioncore Cloud link lost. Operating on local relay.');
      };

      socket.addEventListener('open', () => {
        manualDisconnect = false;
        store.wsURL = url;
        setStatus('cloud');
        systemNote('Ioncore Cloud connected.');
        sendJoin();
      });
      socket.addEventListener('close', handleFailure);
      socket.addEventListener('error', handleFailure);
      socket.addEventListener('message', ev => {
        try {
          const data = JSON.parse(ev.data);
          if(data && data.type === 'chat') receive(data);
          if(data && data.type === 'comment') handleComment(data);
          if(data && data.type === 'like') handleLike(data);
          if(data && data.type === 'caption') handleCaption(data);
          if(data && data.type === 'system') systemNote(data.text);
          if(data && data.type === 'users') updateUsers(data.users || []);
          if(data && data.type === 'count') liveCount.textContent = data.count;
          if(data && data.type === 'history') {
            store.clearMsgs();
            feed.innerHTML = '';
            (data.messages || []).forEach(m => receive(m));
          }
          if(data && data.type === 'id') clientId = data.id;
          if(data && data.type === 'listeners') updateListenerCount(data.id, data.count);
          if(data && data.type === 'watcher') handleWatcher(data.id);
          if(data && data.type === 'offer') handleOffer(data);
          if(data && data.type === 'answer') handleAnswer(data);
          if(data && data.type === 'candidate') handleCandidate(data);
          if(data && data.type === 'bye') handleBye(data);
          if(data && data.type === 'join-request') handleJoinRequest(data.id, data.user);
          if(data && data.type === 'join-approved') handleJoinApproved();
          if(data && data.type === 'join-denied') handleJoinDenied();
          if(data && data.type === 'mic-request') handleMicRequest(data.id, data.user);
          if(data && data.type === 'mic-approved') handleMicApproved();
          if(data && data.type === 'mic-denied') handleMicDenied();
          if(data && data.type === 'thumb') handleThumbnail(data.id, data.thumb);
        } catch {}
      });
    }

    });

      function postMessage({ text='', image, file, fileName, fileType, name, isAction=false, broadcast=false, video, room }){
      if(broadcast && joinApproved && pendingJoinHost){
        room = pendingJoinHost;
      }
      const msg = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        type: 'chat',
        user: store.user,
          text: text,
          room: room,
        image: image,
        file: file,
        fileName: fileName || name,
        fileType: fileType,
        name: fileName || name,
        isAction,
        broadcast,
        video,
        ts: Date.now(),
        likes: 0,
        comments: []
      };

      // Push to UI + storage immediately
        receive(msg, true);
        if(!room) store.pushMsg(msg);

      // Broadcast locally
      try { bc && bc.postMessage(msg); } catch {}

      // Send to server if available
        try { if(socket && socket.readyState === 1) socket.send(JSON.stringify(msg)); } catch {}
      }

    // --- WebRTC helpers ---
      function startBroadcast(stream, audioOnly=false){
        if(broadcasting) return;
        const getStream = stream ? Promise.resolve(stream) : navigator.mediaDevices.getUserMedia(audioOnly ? { audio: true } : { video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, audio: true });
        getStream.then(stream => {
          localStream = stream;
          recordedChunks = [];
          if(!audioOnly){
            recordCanvas = document.createElement('canvas');
            recordCtx = recordCanvas.getContext('2d');
            const draw = () => {
              const vids = videoContainer.querySelectorAll('video');
              let w = 0, h = 0;
              vids.forEach(v => { w += v.videoWidth || 0; h = Math.max(h, v.videoHeight || 0); });
              if(w && h){
                recordCanvas.width = w;
                recordCanvas.height = h;
                let x = 0;
                vids.forEach(v => {
                  try { recordCtx.drawImage(v, x, 0, v.videoWidth || 0, h); } catch{}
                  x += v.videoWidth || 0;
                });
              }
              drawHandle = requestAnimationFrame(draw);
            };
            draw();
            try {
              const canvasStream = recordCanvas.captureStream(30);
              const mime = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1') ? 'video/mp4' : 'video/webm';
              mediaRecorder = new MediaRecorder(canvasStream, { mimeType: mime });
              recordMime = mime;
              mediaRecorder.ondataavailable = e => { if(e.data.size) recordedChunks.push(e.data); };
              mediaRecorder.start();
            } catch {}
          }
          broadcasting = true;
          broadcastBtn.textContent = '⏹ End';
          broadcastBtn.title = 'End Ioncore live feed';
          broadcastBtn.classList.add('live');
          updateHeaderButtons();
          fullscreenBtn.textContent = '⛶ Fullscreen';
          videoContainer.removeAttribute('hidden');
          const el = document.createElement(audioOnly ? 'audio' : 'video');
          el.srcObject = stream;
          el.muted = true;
          el.setAttribute('muted','');
          el.autoplay = true;
          el.setAttribute('autoplay','');
          el.playsInline = true;
          el.setAttribute('playsinline','');
          el.controls = true;
          if(!audioOnly){
            attachCaptions(el);
            captionTrack = el.addTextTrack('captions', 'Live', (document.documentElement.lang||'en').slice(0,2));
            captionTrack.mode = 'showing';
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(SpeechRecognition){
              speechRec = new SpeechRecognition();
              speechRec.lang = document.documentElement.lang || 'en-US';
              speechRec.continuous = true;
              speechRec.interimResults = false;
              speechRec.addEventListener('result', e => {
                const transcript = Array.from(e.results).map(r => r[0].transcript).join('').trim();
                if(transcript && captionTrack){
                  const Cue = window.VTTCue || window.TextTrackCue;
                  try{ captionTrack.addCue(new Cue(el.currentTime, el.currentTime+5, transcript)); }
                  catch(err){ console.error('cue error', err); }
                  try{ sendSignal({ type: 'caption', text: transcript }); }catch{}
                }
              });
              speechRec.addEventListener('error', err => console.error('speech error', err));
              try{ speechRec.start(); }catch{}
            }
          }
          videoContainer.appendChild(el);
          const start = el.play();
          if(start && start.catch){ start.catch(() => {}); }
          broadcastVideo = el;
          sendSignal({ type: audioOnly ? 'mic-broadcaster' : 'broadcaster' });
          postMessage({ text: '🔴 Ioncore broadcast live', broadcast: true });
        }).catch(() => alert('Ioncore Cloud could not access camera/microphone'));
      }

      function switchCamera(){
        if(!localStream) return;
        usingFrontCamera = !usingFrontCamera;
        const videoTrack = localStream.getVideoTracks()[0];
        const audioTracks = localStream.getAudioTracks();
        if(videoTrack) videoTrack.stop();
        navigator.mediaDevices.getUserMedia({ video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, audio: false })
          .then(stream => {
            const newVideoTrack = stream.getVideoTracks()[0];
            localStream = new MediaStream([...audioTracks, newVideoTrack]);
            if(broadcastVideo) broadcastVideo.srcObject = localStream;
            for(const id in peerConnections){
              const sender = peerConnections[id].getSenders().find(s => s.track && s.track.kind === 'video');
              if(sender) sender.replaceTrack(newVideoTrack);
            }
          }).catch(() => alert('Ioncore Cloud could not switch camera'));
      }

    function endBroadcast(forced=false){
      if(!broadcasting) return;
      broadcasting = false;
      updateHeaderButtons();
      joinApproved = false;
      micApproved = false;
      if(pendingJoinHost && streams[pendingJoinHost] && streams[pendingJoinHost].requestBtn){
        streams[pendingJoinHost].requestBtn.disabled = false;
      }
      if(pendingMicHost && streams[pendingMicHost] && streams[pendingMicHost].micBtn){
        streams[pendingMicHost].micBtn.disabled = false;
      }
      pendingJoinHost = null;
      pendingMicHost = null;
      broadcastBtn.disabled = false;
      broadcastBtn.textContent = '🎥 Live';
      broadcastBtn.title = 'Launch Ioncore live feed';
        broadcastBtn.classList.remove('live');
        broadcastVideo = null;
        const share = forced ? true :
          confirm('Post to chat?\nPress OK to post or Cancel to delete.');
        const note = forced ? new Date().toLocaleString() : (share ?
          (prompt('Broadcast end comment?') || '').trim() : '');

      const vidCount = videoContainer.querySelectorAll('video').length;
      const baseText = `⏹ Ioncore broadcast ended${note ? ': '+note : ''}`;
      const msgText = vidCount > 1 ? `${baseText} (multi-cam)` : baseText;
      const hadRecorder = !!mediaRecorder;
      if(mediaRecorder){
          mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: recordMime });
          const reader = new FileReader();
          reader.onloadend = () => {
            const dataUrl = reader.result;
            if(share){
              postMessage({
                text: msgText,
                video: dataUrl,
                file: dataUrl,
                fileName: `broadcast-${Date.now()}.${recordMime === 'video/mp4' ? 'mp4' : 'webm'}`,
                fileType: recordMime,
                image: broadcastThumb,
                broadcast: true
              });
            }
          };
          reader.readAsDataURL(blob);
        };
        try { mediaRecorder.stop(); } catch {}
        mediaRecorder = null;
      }
      if(drawHandle) cancelAnimationFrame(drawHandle);
      drawHandle = null;
      if(localStream){
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      for(const id in peerConnections){
        try{ peerConnections[id].close(); }catch{}
        delete peerConnections[id];
      }
      sendSignal({ type: 'end-broadcast' });
      videoContainer.innerHTML = '';
      videoContainer.setAttribute('hidden','');
      if(document.fullscreenElement === videoContainer){
        try{ document.exitFullscreen(); }catch{}
      }
      document.body.classList.remove('broadcast-mode');
      if(speechRec){ try{ speechRec.stop(); }catch{} speechRec = null; }
      captionTrack = null;
      if(!hadRecorder && share){
        postMessage({ text: msgText, image: broadcastThumb, broadcast: true });
      }
      broadcastThumb = null;
    }

      function startWatching(id){
        sendSignal({ type: 'watcher', id });
      }

      function endWatching(id){
        sendSignal({ type: 'unwatcher', id });
      }

    function handleWatcher(id){
      const pc = new RTCPeerConnection();
      peerConnections[id] = pc;
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      pc.onicecandidate = e => { if(e.candidate) sendSignal({ type:'candidate', id, candidate: e.candidate }); };
      pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => {
        sendSignal({ type:'offer', id, sdp: pc.localDescription });
      });
    }

      function handleOffer(msg){
        const pc = new RTCPeerConnection();
        peerConnections[msg.id] = pc;
        pc.ontrack = ev => {
          if(pc._video) return; // avoid duplicate video elements per peer
          const vid = document.createElement('video');
          vid.srcObject = ev.streams[0];
          vid.autoplay = true;
          vid.setAttribute('autoplay','');
          vid.playsInline = true;
          vid.setAttribute('playsinline','');
          vid.controls = true;
          attachCaptions(vid);
          const liveTrack = vid.addTextTrack('captions', 'Live', (document.documentElement.lang||'en').slice(0,2));
          liveTrack.mode = 'showing';
          if(broadcasting){
            videoContainer.appendChild(vid);
          } else {
            const box = streams[msg.id] && streams[msg.id].video;
            if(box) box.appendChild(vid);
          }
          // try to begin playback immediately (mobile requires user gesture)
          vid.muted = true;
          vid.setAttribute('muted','');
          const playPromise = vid.play();
          if(playPromise && playPromise.then){
            playPromise.then(() => { vid.muted = false; vid.removeAttribute('muted'); }).catch(() => { vid.muted = false; vid.removeAttribute('muted'); });
          } else {
            vid.muted = false;
            vid.removeAttribute('muted');
          }
          if(streams[msg.id]){
            streams[msg.id].vid = vid;
            streams[msg.id].captionTrack = liveTrack;
          }
          pc._video = vid;
        };
        pc.onicecandidate = e => { if(e.candidate) sendSignal({ type:'candidate', id: msg.id, candidate: e.candidate }); };
        pc.setRemoteDescription(new RTCSessionDescription(msg.sdp))
          .then(() => pc.createAnswer())
          .then(ans => pc.setLocalDescription(ans))
          .then(() => { sendSignal({ type:'answer', id: msg.id, sdp: pc.localDescription }); });
      }

    function handleAnswer(msg){
      const pc = peerConnections[msg.id];
      if(pc) pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    }

    function handleCandidate(msg){
      const pc = peerConnections[msg.id];
      if(pc && msg.candidate) pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
    }

      function handleBye(msg){
        const pc = peerConnections[msg.id];
        if(pc){
          if(pc._video) pc._video.remove();
          pc.close();
          delete peerConnections[msg.id];
        }
        if(streams[msg.id]){
          streams[msg.id].started = false;
          streams[msg.id].video.innerHTML = '';
          streams[msg.id].container.classList.remove('open');
          if(streams[msg.id].tuneBtn) streams[msg.id].tuneBtn.disabled = false;
          streams[msg.id].vid = null;
          streams[msg.id].captionTrack = null;
        }
        if((joinApproved && pendingJoinHost === msg.id) || (micApproved && pendingMicHost === msg.id)){
          endBroadcast(true);
          pendingJoinHost = null;
          pendingMicHost = null;
          joinApproved = false;
          micApproved = false;
        }
      }

    function handleJoinRequest(id, user){
      const ok = confirm(`Allow @${user || 'user'} to join?`);
      sendSignal({ type: ok ? 'approve-join' : 'deny-join', id });
    }

    function handleJoinApproved(){
      joinApproved = true;
      const stream = streams[pendingJoinHost];
      if(stream && stream.requestBtn) stream.requestBtn.disabled = true;
      broadcastBtn.disabled = false;
      const hostVid = stream && stream.video.querySelector('video');
      if(hostVid) videoContainer.appendChild(hostVid);
      startBroadcast();
    }

    function handleJoinDenied(){
      joinApproved = false;
      const stream = streams[pendingJoinHost];
      if(stream && stream.requestBtn) stream.requestBtn.disabled = false;
      pendingJoinHost = null;
      broadcastBtn.disabled = false;
      broadcastBtn.textContent = '🎥 Live';
      alert('Join request denied or busy.');
    }

    function handleMicRequest(id, user){
      const ok = confirm(`Allow @${user || 'user'} to speak?`);
      sendSignal({ type: ok ? 'approve-mic' : 'deny-mic', id });
    }

    function handleMicApproved(){
      micApproved = true;
      const stream = streams[pendingMicHost];
      if(stream && stream.micBtn) stream.micBtn.disabled = true;
      const hostVid = stream && stream.video.querySelector('video');
      if(hostVid) videoContainer.appendChild(hostVid);
      startBroadcast(null, true);
    }

    function handleMicDenied(){
      micApproved = false;
      const stream = streams[pendingMicHost];
      if(stream && stream.micBtn) stream.micBtn.disabled = false;
      pendingMicHost = null;
      alert('Mic request denied.');
    }

    function sendSignal(data){
      try { socket && socket.readyState === 1 && socket.send(JSON.stringify(data)); } catch {}
    }

      function receive(m, isLocal=false){
        if(!m || seen.has(m.id)) return;
        seen.add(m.id);
        if(m.room){
          if(!streams[m.room]) ensureStreamThumb(m.room, m.room);
          if(streams[m.room]) appendStreamMessage(streams[m.room], m);
        } else {
          appendMessage(m);
          if(!isLocal) store.pushMsg(m);
        }
      }

      function renderHistory(){
      feed.innerHTML = '';
      const items = store.loadMsgs();
      items.slice().reverse().forEach(m => appendMessage(m, true));
      scrollToTop();
    }

      function appendMessage(m, skipScroll=false){
        const mine = m.user === store.user;
        const li = document.createElement('li');
      li.className = 'msg' + (mine ? ' mine' : '');
      li.dataset.id = m.id;

      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = initials(m.user);

      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (m.collapsed? ' collapsed' : '');

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `<span class="who">@${escapeHTML(m.user)}</span> · <span>${fmtTime(m.ts)}</span>`;

      const text = document.createElement('div');
      text.className = 'msg-text';
      text.innerHTML = renderText(m.text || '', !!m.isAction);

      if(mine){
        const btn = document.createElement('button');
        btn.className = 'min-btn';
        btn.title = 'Minimize / expand';
        btn.setAttribute('aria-label','Minimize message');
        btn.textContent = m.collapsed? '⤢' : '⤡';
        btn.addEventListener('click', () => {
          li.classList.toggle('collapsed');
          btn.textContent = li.classList.contains('collapsed') ? '⤢' : '⤡';
        });
        bubble.appendChild(btn);
      }

        bubble.appendChild(meta);
      bubble.appendChild(text);
      const fileData = m.file || m.image;
      if(fileData){
        const mime = m.fileType || ((fileData.match(/^data:(.*?);/) || [])[1] || '');
        const filename = m.fileName || m.name || '';
        const isModel = mime.includes('model') || /\.glb$/i.test(filename) || /\.gltf$/i.test(filename);
        if(mime.startsWith('video/')){
          const vid = document.createElement('video');
          vid.src = fileData;
          vid.controls = true;
          vid.playsInline = true;
          vid.setAttribute('playsinline','');
          vid.style.maxWidth = '100%';
          vid.style.borderRadius = '8px';
          attachCaptions(vid);
          if(m.image) vid.poster = m.image;
          bubble.appendChild(vid);
        } else if(mime.startsWith('audio/')){
          const aud = document.createElement('audio');
          aud.src = fileData;
          aud.controls = true;
          aud.style.width = '100%';
          bubble.appendChild(aud);
        } else if(isModel){
          const model = document.createElement('model-viewer');
          model.src = fileData;
          model.alt = filename || '3D model';
          model.style.width = '100%';
          model.style.height = '300px';
          model.style.borderRadius = '8px';
          model.setAttribute('camera-controls','');
          model.setAttribute('auto-rotate','');
          bubble.appendChild(model);
        } else if(mime.startsWith('image/')){
          const img = document.createElement('img');
          img.src = fileData;
          img.alt = filename || 'image';
          img.style.maxWidth = '100%';
          img.style.borderRadius = '8px';
          img.loading = 'lazy';
          bubble.appendChild(img);
        } else {
          const link = document.createElement('a');
          link.href = fileData;
          link.textContent = filename || 'download';
          link.download = filename || 'file';
          bubble.appendChild(link);
        }
      }

      const actions = document.createElement('div');
      actions.className = 'actions';
      const likeBtn = document.createElement('button');
      likeBtn.className = 'like-btn';
      likeBtn.textContent = `❤️ ${m.likes || 0}`;
      likeBtn.addEventListener('click', () => {
        try { if(socket && socket.readyState === 1) socket.send(JSON.stringify({ type:'like', messageId: m.id, user: store.user })); } catch {}
      });
      actions.appendChild(likeBtn);

      const commentsBox = document.createElement('div');
      commentsBox.className = 'comments';
      const commentsList = document.createElement('div');
      commentsList.className = 'comments-list';
      (m.comments || []).forEach(c => appendCommentElement(commentsList, c));
      const commentForm = document.createElement('form');
      commentForm.className = 'comment-form';
      const commentInput = document.createElement('input');
      commentInput.placeholder = 'Add comment...';
      commentForm.appendChild(commentInput);
      commentForm.addEventListener('submit', ev => {
        ev.preventDefault();
        const txt = commentInput.value.trim();
        if(!txt) return;
        try { if(socket && socket.readyState === 1) socket.send(JSON.stringify({ type:'comment', messageId: m.id, text: txt, user: store.user })); } catch {}
        commentInput.value = '';
      });
      commentsBox.appendChild(commentsList);
      commentsBox.appendChild(commentForm);

      bubble.appendChild(actions);
      bubble.appendChild(commentsBox);

      if(mine){
        li.appendChild(bubble);
        li.appendChild(av);
      } else {
        li.appendChild(av);
        li.appendChild(bubble);
      }

        feed.insertBefore(li, feed.firstChild);
        if(!skipScroll) scrollToTop();
      }

      function appendStreamMessage(stream, m){
        const li = document.createElement('li');
        li.textContent = `@${m.user}: ${m.text}`;
        stream.feed.appendChild(li);
        stream.feed.scrollTop = stream.feed.scrollHeight;
      }

      function appendCommentElement(list, c){
        const div = document.createElement('div');
        div.className = 'comment';
        div.innerHTML = `<span class="who">@${escapeHTML(c.user)}</span>: ${renderText(c.text)}`;
        list.appendChild(div);
      }

      function handleComment(c){
        if(!c || seenComments.has(c.id)) return;
        seenComments.add(c.id);
        const msgEl = feed.querySelector(`li[data-id="${c.messageId}"]`);
        const list = msgEl && msgEl.querySelector('.comments-list');
        if(list) appendCommentElement(list, c);
      }

      function handleLike(l){
        const msgEl = feed.querySelector(`li[data-id="${l.messageId}"]`);
        const btn = msgEl && msgEl.querySelector('.like-btn');
        if(btn) btn.textContent = `❤️ ${l.count}`;
      }

      function handleCaption(c){
        const s = streams[c.id];
        if(!s || !s.captionTrack || !s.vid) return;
        const Cue = window.VTTCue || window.TextTrackCue;
        try{ s.captionTrack.addCue(new Cue(s.vid.currentTime, s.vid.currentTime+5, c.text)); }catch{}
      }

      function systemNote(t){
        const div = document.createElement('div');
        div.className = 'system';
      div.textContent = t;
      feed.insertBefore(div, feed.firstChild);
      scrollToTop();
    }

    function scrollToTop(){
      feed.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function attachCaptions(vid){
      if(!vid) return;
      const tracks = [
        { src: 'static/captions/en.vtt', srclang: 'en', label: 'English', def: true },
        { src: 'static/captions/pt-en.vtt', srclang: 'pt', label: 'Portuguese/English' },
        { src: 'static/captions/ko.vtt', srclang: 'ko', label: 'Korean' },
        { src: 'static/captions/ar-en.vtt', srclang: 'ar', label: 'Arabic/English' }
      ];
      tracks.forEach(t => {
        const track = document.createElement('track');
        track.kind = 'captions';
        track.src = t.src;
        track.srclang = t.srclang;
        track.label = t.label;
        if(t.def) track.default = true;
        vid.appendChild(track);
      });
    }

    // --- Helpers ---
    function fmtTime(ts){
      const d = new Date(ts || Date.now());
      const h = d.getHours().toString().padStart(2,'0');
      const m = d.getMinutes().toString().padStart(2,'0');
      return `${h}:${m}`;
    }
    function initials(name){
      const parts = name.replace(/[^a-zA-Z0-9_\-.]/g,' ').trim().split(/\s+|[_.-]/).filter(Boolean);
      const a = (parts[0]||'?')[0]||'?';
      const b = (parts[1]||'')[0]||'';
      return (a + b).toUpperCase();
    }
    function escapeHTML(s){
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
    }
    function linkify(s){
      const url = /((https?:\/\/)?[\w.-]+\.[a-z]{2,}(?:\/[\w%./#?=&-]*)?)/gi;
      return s.replace(url, (u) => {
        const href = /^(https?:)?\/\//i.test(u) ? u : 'https://' + u;
        return `<a href="${href}" target="_blank" rel="noopener">${escapeHTML(u)}</a>`;
      });
    }
    function renderText(s, isAction=false){
      const safe = escapeHTML(s);
      const withLinks = linkify(safe);
      return isAction ? `<em>${withLinks}</em>` : withLinks;
    }

    // Boot
    requireAuth();
  })();
  </script>

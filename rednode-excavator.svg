<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" role="img" aria-labelledby="title desc">
  <title id="title">Red and yellow excavator icon</title>
  <desc id="desc">A stylized excavator with a red cab and bucket and a yellow arm, body, and tracks.</desc>
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff4d67" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="22" y="62" width="84" height="34" rx="14" fill="#f6d365" stroke="#f6d365" stroke-width="4"/>
    <rect x="92" y="26" width="44" height="42" rx="8" fill="#ff4d67" stroke="#f6d365" stroke-width="6"/>
    <rect x="38" y="74" width="38" height="14" rx="4" fill="url(#glow)" opacity="0.85"/>
    <path d="M106 72 L152 72 L168 104 L152 104 L138 88 L106 88 Z" fill="#f6d365" stroke="#f6d365" stroke-width="4"/>
    <path d="M132 58 L168 70 L168 86 L132 74 Z" fill="#ff4d67" stroke="#f6d365" stroke-width="5" stroke-linejoin="round"/>
    <path d="M98 74 C122 70 142 54 150 44" stroke="#f6d365" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="98" r="10" fill="#0c0c0c" stroke="#f6d365" stroke-width="4"/>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111d"><title>Ioncore Energy | Catalogue Login</title>
  <meta name="description" content="Completed webpage login for confidential Ioncore catalogue information.">
  <link rel="icon" href="/battery.svg"><link rel="stylesheet" href="/styles.css"><script src="/webpage-login.js" defer></script>
</head>
<body class="access-page">
  <main class="access-shell access-shell--compact">
    <section class="access-panel" aria-labelledby="catalogue-login-title">
      <a class="access-brand" href="/index.html"><img src="/battery.svg" alt=""><span>Ioncore Energy</span></a>
      <div class="access-heading"><span class="eyebrow">Restricted catalogue</span><h1 id="catalogue-login-title">Complete webpage login</h1><p id="catalogue-login-copy">Use the catalogue access code to enter product and commercial information.</p></div>
      <form id="webpage-login-form" class="access-form" novalidate>
        <label>Webpage access code<input id="webpage-login-code" name="code" type="password" autocomplete="current-password" required autofocus></label>
        <p id="webpage-login-error" class="access-error" role="alert"></p>
        <button class="btn btn-primary" type="submit">Unlock catalogue</button><a class="btn btn-outline" href="/index.html">Return to index</a>
      </form>
    </section>
    <aside class="access-aside"><span>02</span><h2>Catalogue<br>clearance.</h2><p>Your dossier acknowledgement must remain active before this final access step.</p></aside>
  </main>
</body>
</html>
